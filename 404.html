<script>
/* Theme and language, shared by every page that is not the article.
 *
 * The article carries its own copy of this machinery inside its template, along with review
 * mode. Both belong here; moving them is a later step, checked against the published bytes.
 *
 * A page supplies window.ES (its Spanish dictionary, keyed by data-i18n) before this runs.
 * Leave it undefined and the language control simply does not appear.
 */
const store={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
const track=(ev,props)=>{try{if(window.posthog&&posthog.capture)posthog.capture(ev,props||{});}catch(e){}};

const ES = window.ES || null;
const TR={'Language and theme':'Idioma y tema','Language':'Idioma','Theme':'Tema','System':'Sistema','Light':'Claro','Dark':'Oscuro'};
const tr = x => (LANG==='es' && TR[x]!==undefined) ? TR[x] : x;

const urlLang = new URLSearchParams(location.search).get('lang');
let LANG = (['en','es'].includes(urlLang) && urlLang)
        || (['en','es'].includes(store.get('kp.lang')) && store.get('kp.lang'))
        || ((navigator.language||'').toLowerCase().startsWith('es') ? 'es' : 'en');
if(!ES) LANG='en';
const EN = {};   /* snapshot of the English markup, filled on the first pass */

function applyLang(lang){
  LANG=lang; store.set('kp.lang',lang); document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n; if(!(k in EN)) EN[k]=el.innerHTML;
    const v = lang==='es' ? (ES[k] ?? EN[k]) : EN[k];
    if(el.innerHTML!==v) el.innerHTML=v;
  });
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===lang));
  const bar=document.querySelector('.controls-bar');
  if(bar){ bar.setAttribute('aria-label', tr(bar.querySelector('[data-lang]') ? 'Language and theme' : 'Theme'));
           bar.querySelectorAll('[role="group"]').forEach(g=>g.setAttribute('aria-label', tr(g.querySelector('[data-lang]') ? 'Language' : 'Theme'))); }
  document.querySelectorAll('[data-theme-pick]').forEach(b=>b.title=tr(b.dataset.themePick==='system'?'System':b.dataset.themePick==='light'?'Light':'Dark'));
  /* an article is a separate page per language: send readers to the one they are reading in */
  document.querySelectorAll('[data-piece-lang]').forEach(a=>a.setAttribute('hreflang', a.dataset.pieceLang));
}
function applyTheme(pick){
  store.set('kp.theme',pick);
  if(pick==='system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=pick;
  document.querySelectorAll('[data-theme-pick]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.themePick===pick));
}

if(ES) applyLang(LANG);
applyTheme(['light','dark','system'].includes(store.get('kp.theme')) ? store.get('kp.theme') : 'system');
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.lang===LANG) return; track('language_switch',{to:b.dataset.lang,from:LANG}); applyLang(b.dataset.lang); }));
document.querySelectorAll('[data-theme-pick]').forEach(b=>b.addEventListener('click',()=>{ track('theme_switch',{to:b.dataset.themePick}); applyTheme(b.dataset.themePick); }));
document.querySelectorAll('a[data-piece]').forEach(a=>a.addEventListener('click',()=>track('piece_open',{piece:a.dataset.piece, lang:a.dataset.pieceLang||'en', from_lang:LANG})));
</script>
